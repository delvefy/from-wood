# reset-password is called before the player has any session, so it must not
# require a JWT; it protects itself (neutral responses, service-role lookups).
[functions.reset-password]
verify_jwt = false

# delete-account keeps the default gateway JWT check: only a signed-in player
# can reach it, and the function re-verifies their password itself before
# deleting anything.
[functions.delete-account]
verify_jwt = true

# revenuecat-webhook is called by RevenueCat's servers, which have no Supabase
# JWT; it authenticates the shared secret in the Authorization header itself
# (must match the RC_WEBHOOK_SECRET function secret).
[functions.revenuecat-webhook]
verify_jwt = false
